    if (N >= cb.startLine && N <= cb.endLine) { land(g.curBlock, N - cb.startLine); return; }
  } else {
    land(g.curBlock, Math.min(Math.max(1, N), cb.lines.length) - 1);
    return;
  }
  for (let bi = 0; bi < g.blocks.length; bi++) {
    const b = g.blocks[bi];
    if (b.kind === "file" && N >= b.startLine && N <= b.endLine) {
      land(bi, N - b.startLine);
      return;
    }
  }
  g.status = `line ${N} not loaded — pull it first`;
}

function execCommand(cmdStr) {
  const trimmed = cmdStr.trim();
  if (!trimmed) return;
  const parts = trimmed.split(/\s+/);
  const verb = parts[0].toLowerCase();
  const args = parts.slice(1);

  if (/^\d+$/.test(verb)) {
    gotoLine(parseInt(verb, 10));
    return;
  }
  if (verb.startsWith("/") && verb.length > 1) {
    const term = trimmed.slice(1);
    g.lastSearch = term;
    g.searchQuery = term;
    searchMove(1);
    return;
  }

  if (verb === "pull") {
    const path = args[0], range = args[1] || "";
    if (!path || !range.includes(":")) {
      g.status = "usage: pull <path> <start>:<end>";
      return;
    }
    const [sStr, eStr] = range.split(":");
    const s = parseInt(sStr, 10) || 1, e = parseInt(eStr, 10) || s;
    if (g.files[path] === undefined) {
      g.status = `pull: cannot read ${path}`;
      return;
    }
    const all = g.files[path].split(/\r?\n/);
    const clS = Math.max(1, s), clE = Math.min(all.length, e);
    if (clS > clE) { g.status = "pull: empty range"; return; }
    createBlock({ kind: "file", source: path, startLine: clS, endLine: clE, lines: all.slice(clS - 1, clE) });
    g.status = `pulled ${path} ${clS}:${clE}`;
    saveManifest(true);
  } else if (verb === "scratch") {
    createBlock({ kind: "scratch", lines: [args.join(" ") || ""] });
    saveManifest(true);
  } else if (verb === "drop" || verb === "close") {
    dropBlock();
  } else if (verb === "split") {
    splitBlock();
  } else if (verb === "join") {
    joinBlock();
  } else if (verb === "edge" || verb === "edges") {
    enterEdgeAdjust();
  } else if (verb === "goto") {
    const targetLine = parseInt(args[0], 10);
    if (!isNaN(targetLine)) gotoLine(targetLine);
    else g.status = "usage: goto <line>";
  } else if (verb === "grep") {
    openTextFinder(args.join(" "));
  } else if (verb === "search" || verb === "find") {
    const term = args.join(" ");
    if (term) { g.lastSearch = term; g.searchQuery = term; }
    else g.searchQuery = g.lastSearch;
    searchMove(1);
  } else if (verb === "reload" || verb === "revert") {
    if (args[0] === "all") reloadAll();
    else reloadBlock(g.curBlock);
  } else if (verb === "open") {
    const p = args[0];
    if (p && g.files[p] !== undefined) {
      saveManifest(true);
      importManifest(g.files[p], p);
    } else {
      enterPagePicker();
    }
  } else if (verb === "page" || verb === "saveas") {
    const title = args.join(" ");
    if (!title) {
      g.status = g.pagePath
        ? `page: ${g.pageTitle}  (${g.pagePath})`
        : "no page yet — :page <title> saves these blocks as one";
    } else {
      adoptPage(title);
    }
  } else if (verb === "range") {
    if (g.blocks.length && g.blocks[g.curBlock].kind === "file") {
      const b = g.blocks[g.curBlock];
      if (args[0] && args[0].includes(":")) {
        const [sStr, eStr] = args[0].split(":");
        const s = parseInt(sStr, 10), e = parseInt(eStr, 10);
        if (!isNaN(s) && !isNaN(e) && g.files[b.source] !== undefined) {
          const full = g.files[b.source].split(/\r?\n/);
          b.startLine = Math.max(1, s);
          b.endLine = Math.min(full.length, e);
          b.lines = full.slice(b.startLine - 1, b.endLine);
          b.savedLines = [...b.lines];
          g.curLine = 0; g.curCol = 0;
          recomputeDirty(g.curBlock);
          g.status = `range → ${b.startLine}:${b.endLine}`;
        }
      } else {
        openRangeFinder(b.source, b.startLine - 1, g.curBlock);
      }
    } else {
      g.status = "range: current block has no source";
    }
  } else if (verb === "md" || verb === "markdown") {
    if (args[0] === "all") {
      g.showMarkdown = !g.showMarkdown;
      g.status = g.showMarkdown ? "markdown styling on everywhere" : "markdown styling off everywhere";
    } else if (g.blocks[g.curBlock]) {
      const b = g.blocks[g.curBlock];
      const now = g.showMarkdown && isMarkdownBlock(b);
      b.mdMode = now ? -1 : 1;
      if (!g.showMarkdown && !now) g.showMarkdown = true;
      g.status = now ? "markdown off for this block" : "markdown on for this block  (:md all toggles everywhere)";
    }
  } else if (verb === "w" || verb === "write" || verb === "save") {
    if (args[0]) g.pagePath = args[0];
    saveAll();
  } else if (verb === "nums" || verb === "numbers") {
    g.showLineNos = !g.showLineNos;
    g.status = g.showLineNos ? "line numbers on" : "line numbers off";
  } else if (verb === "label" || verb === "name") {
    if (g.blocks[g.curBlock]) {
      g.blocks[g.curBlock].label = args.join(" ");
      saveManifest(true);
      g.status = g.blocks[g.curBlock].label ? `labelled: ${g.blocks[g.curBlock].label}` : "label cleared";
    }
  } else if (verb === "organize" || verb === "sort") {
    g.blocks.sort((a, b) => {
      if (a.kind !== b.kind) return a.kind === "file" ? -1 : 1;
      if (a.source !== b.source) return a.source.localeCompare(b.source);
      return a.startLine - b.startLine;
    });
    g.status = "organized — grouped by file, ordered by line";
    saveManifest(true);
  } else if (verb === "?" || verb === "help") {
    g.showHelp = true;
    g.scrollY = 0;
  } else {
    g.status = `unknown command: ${verb}`;
  }
}

// ─── Native Wheel / Trackpad Scroll (Finder Aware) ────────────────────
window.addEventListener("wheel", (e) => {
  if (g.finder.mode !== "NONE") {
    const dir = e.deltaY > 0 ? 1 : -1;
    const steps = Math.max(1, Math.floor(Math.abs(e.deltaY) / 24));
    if (g.finder.mode === "RANGE") {
      g.finder.cur = Math.max(0, Math.min(g.finder.lines.length - 1, g.finder.cur + dir * steps));
    } else {
      const count =
        g.finder.mode === "PAGE" ? g.finder.pagePaths.length + 2 :
        g.finder.mode === "TEXT" ? g.finder.textMatches.length :
        g.finder.matches.length;
      g.finder.sel = Math.max(0, Math.min(Math.max(0, count - 1), g.finder.sel + dir * steps));
    }
    requestDraw();
    return;
  }
  g.scrollY += e.deltaY;
  g.followCursor = false;
  requestDraw();
}, { passive: true });

document.getElementById("folder-picker").addEventListener("change", async (e) => {
  const files = e.target.files;
  for (const f of files) {
    const rel = f.webkitRelativePath || f.name;
    const text = await f.text();
    g.files[rel] = text;
    g.files[f.name] = text;
  }
  refreshLoadedFileBlocks();
  g.status = `mounted folder (${files.length} files) · Alt-W / ⌘P to pull`;
  enterPagePicker();
});

window.addEventListener("resize", () => {
  updateMetrics();
  requestDraw();
});

// Focus Key Sink
window.addEventListener("click", () => keySink.focus());

// ─── Initial Startup ──────────────────────────────────────────────────
updateMetrics();
resetBlink();

// Check local storage backup
const backup = localStorage.getItem("educed_manifest_backup");
const savedPath = localStorage.getItem("educed_page_path") || ".educed/main.page";
if (backup) {
  importManifest(backup, savedPath);
} else {
  createBlock({
    kind: "scratch",
    label: "about me",
    lines: [
      "# Tristen MacPherson",
      "Independent game developer & games researcher · Saskatoon, Canada.",
      "Pursuing a master's in games research.",
      "",
      "Links:",
      "- Discord:   https://discord.com/invite/E6ky7d5cMq",
      "- Instagram: https://www.instagram.com/educedmoment/",
      "- GitHub:    https://github.com/TmacP",
      "- Contact:   tristenmac@gmail.com"
    ]
  });

  createBlock({
    kind: "scratch",
    label: "educed editor",
    lines: [
      "# educed",
      "This site is itself a client-side, block-oriented text editor.",
      "Pure static HTML5 Canvas. Zero tracking, zero telemetry, zero server backend.",
      "",
      "Controls:",
      "- ⌘O / Opt-O: Mount local project folder (File System Access API)",
      "- ⌘P / Alt-W: Pull file slices into active workspace",
      "- ⌘S / Ctrl-S: Splice edited blocks back into original source files",
      "- :help / :?:  Show full keybinding reference"
    ]
  });

  createBlock({
    kind: "scratch",
    label: "portfolio",
    lines: [
      "# Games & Projects",
      "- Educe (Steam):",
      "  https://store.steampowered.com/app/4486530/Educe/",
      "",
      "- Project Gatherwood (CrazyGames):",
      "  https://www.crazygames.com/game/project-gatherwood-gou"
    ]
  });
}

// Restore handle asynchronously and rehydrate blocks
restoreDirHandle();
requestDraw();
</script>
