<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>photo poki</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <!-- Poki SDK disabled for self-hosted beta / study builds. The game boots
       standalone when PokiSDK is undefined (all calls in main.js are guarded).
       Re-enable only for a poki.com portal deploy — NOT for the study, which
       needs its own telemetry (Poki forbids custom telemetry).
  <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script> -->
  <!-- Per-game config for the SHARED renderer (src/web/main.js). Must run as a
       classic (non-module) script so it executes before the deferred module. -->
  <script>
    window.EDUCE_WEB_CONFIG = {
      wasmFile: 'photo_poki.wasm',
      width: 54,             // must match game_config.h WIDTH (exact 9:16 portrait)
      height: 96,            // must match game_config.h HEIGHT
      roomCols: 9,           // must match game_config.h ROOM_TILE_COLS (render_data layout!)
      roomRows: 16,          // must match game_config.h ROOM_TILE_ROWS
      tilePx: 6,             // must match game_config.h TILE_PIXEL_WIDTH/HEIGHT (6px grid)
      viewfinderW: 24,       // must match game_config.h VIEWFINDER_WIDTH  (24×36 portrait, 35mm)
      viewfinderH: 36,       // must match game_config.h VIEWFINDER_HEIGHT
      nativePortrait: true,  // genuinely portrait backbuffer, identity-presented
      noVirtualGamepad: true,// touch-to-photograph (no on-screen joystick/buttons)
      noFont: true,          // draws no text yet — skip LanaPixel .ttf + atlas (~3.9MB)
    };
  </script>
  <style>
    /* No @font-face: photo_poki renders no text, so the 3MB LanaPixel.ttf is
       not shipped (see noFont in EDUCE_WEB_CONFIG + the photo_poki_web make
       target). Restore this block and the font copies if text is added. */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%; height: 100%;
      background-color: #000;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      -webkit-user-select: none; user-select: none;
      overscroll-behavior: none;
      touch-action: none;
    }
    canvas {
      display: block;
      background-color: #000;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: none;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #loading {
      position: absolute; color: #888; font-family: monospace; font-size: 14px;
    }
  </style>
</head>
<body>
  <canvas id="screen" tabindex="0"></canvas>
  <div id="loading">loading...</div>
  <script type="module" src="main.js"></script>
</body>
</html>
